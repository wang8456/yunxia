  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 添加到主屏幕后以独立窗口运行：没有 Safari 工具栏/地址栏，配合播放器的网页全屏就是真满屏 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>云匣</title>
  <meta name="apple-mobile-web-app-title" content="云匣">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="__ASSETS_PREFIX__manifest.json">
  <link rel="apple-touch-icon" href="__ASSETS_PREFIX__icon-180.png">
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
  <style>
    /* dufs 原生界面先藏起来：它一露面就会「闪一下原版界面」。由下面的脚本决定显示哪个。
       注意用 visibility 而不是 display，且只藏 .head/.main 两个容器，不影响文本编辑页 */
    .head, .main { visibility: hidden; }
    html.mfm-native .head, html.mfm-native .main { visibility: visible; }
    #mfmSplash { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; z-index: 9; }
    #mfmSplash i { width: 26px; height: 26px; border: 2.5px solid #dce8f7; border-top-color: #147bff; border-radius: 50%; animation: mfmspin .8s linear infinite; }
    @keyframes mfmspin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* 界面资源永远取最新：style/script 的 URL 带上时间戳，浏览器就没有旧缓存可用。
       代价是每次加载都重新拉这两个文件（局域网内几十 KB，可忽略） */
    (function () {
      // v = 部署时间戳（由 部署到NAS.sh 写入）：同一个版本内浏览器永远命中缓存，部署后换个新 URL 立刻生效
      var P = '__ASSETS_PREFIX__', v = '1793288989';
      /* 主题：在样式表加载前就设好，避免先白后黑闪一下 */
      try { var th = localStorage.getItem('mfm_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) { }
      window.__V = v;
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = P + 'theme.css?v=' + v;
      document.head.appendChild(l);
      // 兜底：万一脚本出错/被拦，4 秒后放出原生界面，别让页面一直空着
      setTimeout(function () {
        var d = document.documentElement;
        if (!d.classList.contains('mfm-native') && !document.querySelector('.app')) {
          d.className += ' mfm-native';
          var s = document.getElementById('mfmSplash');
          if (s) s.parentNode.removeChild(s);
        }
      }, 4000);
    })();
  </script>
</head>

<body>

      </div>
    </div>
    <form class="searchbar hidden">
      <div class="icon">

            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />

  <div class="main">
    <div class="index-page hidden">
      <div class="empty-folder hidden"></div>
      <table class="uploaders-table hidden">
        <thead>
          <tr>
            <th class="cell-name" colspan="2">Name</th>
            <th class="cell-status">Progress</th>
          </tr>
        </thead>
      </table>
      <table class="paths-table hidden">
        <thead>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <div class="editor-page hidden">
      <div class="not-editable hidden"></div>
      <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
    </div>

  <template id="index-data">__INDEX_DATA__</template>
  <script src="__ASSETS_PREFIX__index.js"></script>
  <script>
    /* 这一段必须放在 <template id="index-data"> 之后 —— 之前放在 <head> 里读不到它，
       判断不出页面类型，于是原生界面先露了一次（就是「闪一下第一版界面」的原因） */
    (function () {
      var kind = '';
      try {
        var t = document.getElementById('index-data');
        var bin = atob(t.innerHTML), b = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
        kind = JSON.parse(new TextDecoder().decode(b)).kind;
      } catch (e) { }
      if (kind !== 'Index') {          // 文本编辑页等：用 dufs 原生界面
        document.documentElement.className += ' mfm-native';
        var sp = document.getElementById('mfmSplash');
        if (sp) sp.parentNode.removeChild(sp);
        return;
      }
      document.body.className += ' mfm-index';
      // 图标库要先于 app.js 执行（async=false 才能保证这个顺序）
      // 加载压缩版（部署脚本 build-assets.sh 生成）；缺了就回退到可读源文件，页面不会因此白屏
      function __mfmScript(name, fallback) {
        var e = document.createElement('script');
        e.async = false;
        e.src = '__ASSETS_PREFIX__' + name + '?v=' + (window.__V || '1');
        if (fallback) e.onerror = function () {
          var f = document.createElement('script');
          f.async = false;
          f.src = '__ASSETS_PREFIX__' + fallback + '?v=' + (window.__V || '1');
          document.body.appendChild(f);
        };
        document.body.appendChild(e);
        return e;
      }
      __mfmScript('icons.min.js', 'icons.js');
      __mfmScript('app.min.js', 'app.js');
      __mfmScript('chat.js');
      // 上线自检：只有手动打开 ?selftest=1 才加载，正常访问不下载这个文件
      if (/[?&]selftest/.test(location.search)) {
        var st = document.createElement('script');
        st.async = false;
        st.src = '__ASSETS_PREFIX__selftest.js?v=' + (window.__V || '1');
        document.body.appendChild(st);
      }
    })();
  </script>
</body>

</html>
